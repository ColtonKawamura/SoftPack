name = "SoftPack"
uuid = "fb7fb89e-e452-41c0-b84b-71b3d64946c5"
authors = ["Colton Kawamura"]
version = "0.1.0-DEV"

[compat]
julia = "1.10"

[deps]
# Standard libraries only. DelimitedFiles is intentionally NOT a dependency: the
# softpack-1 CSV reader (src/io/csv.jl) parses inline so it can (a) recover every
# value with the exact round-trip precision the format requires, and (b) handle the
# optional friction column and the string header row cleanly. DelimitedFiles' readdlm
# does neither well for this format. (The stdlib UUID is stable across Julia versions,
# so this is a deliberate format/precision choice, not a version-compat workaround.)
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
# Seeded RNG whose output stays identical across Julia versions, so a seed gives
# the same packing on every machine and Julia release.
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
